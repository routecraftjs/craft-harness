name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything a contributor runs locally, run the same way. The template is
  # its own repository precisely so it gets this: inside the routecraft
  # monorepo, template files reach neither tsc nor ESLint.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run format
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test

  # The promise the template makes: a clone that has run setup boots, walled,
  # with nothing else configured. `setup` generates the API key every surface
  # verifies and the secret the suspension store signs links with; the model
  # key is deliberately not a working one, and no mailbox, allowlist or search
  # key is set at all.
  #
  # The terminal outcome `--once` waits for is the scheduler tick, which fires
  # on its own cron, finds nothing due and drops. That is the one exchange
  # this project produces without reaching anything external, which is what
  # makes it the boot check.
  boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Generate this instance's credentials
        run: bun run setup
      - name: Boot with a generated key and nothing else
        env:
          LLM_API_KEY: not-a-real-key
          # Six fields adds seconds, so the tick fires inside the timeout
          # instead of at the top of the next minute.
          SCHEDULER_CRON: "*/2 * * * * *"
        run: bun run boot-check
      - name: The generated credentials never reach the repository
        run: |
          test -z "$(git status --porcelain)" || {
            echo "setup left tracked changes:"; git status --porcelain; exit 1;
          }
